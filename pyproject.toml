[project]
name = "community-notes-analysis"
version = "0.1.0"
description = "Rank X/Twitter accounts by how many publicly-shown Community Notes their posts received"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "ruff>=0.15.13",
    "ty>=0.0.37",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "SIM"]
