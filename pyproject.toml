[project]
name = "community-notes-analysis"
version = "0.1.0"
description = "Rank X/Twitter accounts by how many publicly-shown Community Notes their posts received"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyarrow>=16",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "ruff>=0.15.13",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "SIM"]
